name: flake-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Lets modules adjust for CI via builtins.getEnv; only visible to
      # --impure evaluation, so it can never affect real builds.
      NIX_CONFIG_CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        # --impure so modules can see NIX_CONFIG_CI.
        run: nix flake check --all-systems --no-build --impure

      - name: Evaluate darwin configurations
        run: |
          nix eval --raw '.#darwinConfigurations.mythique.config.system.build.toplevel.drvPath'

      - name: Evaluate home-manager configurations
        run: |
          nix eval --raw '.#homeConfigurations."nelhage@nomadique".activationPackage.drvPath'
